<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGPU Profiler - Part 1</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 16px; line-height: 1.5; }
        .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        button { padding: 10px 16px; font-size: 14px; cursor: pointer; border-radius: 6px; border: 1px solid #ccc; background: #fff; }
        button:hover:not(:disabled) { background: #f0f0f0; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        pre { background: #1e1e1e; color: #d4d4d4; padding: 16px; border-radius: 8px; overflow-x: auto; height: 450px; font-size: 13px; }
    </style>
</head>
<body>
    <h2>Mobile WebGPU LLM Profiling: Part 1</h2>
    <p id="status">Status: Waiting to initialize...</p>
    
    <div class="controls">
        <button id="btn-128" disabled>Run 128 (5x Sweep)</button>
        <button id="btn-512" disabled>Run 512 (5x Sweep)</button>
        <button id="btn-1024" disabled>Run 1024 (5x Sweep)</button>
        <button id="btn-export" disabled>Export Results JSON</button>
    </div>

    <h3>Output Log</h3>
    <pre id="metrics-log">Awaiting initialization...</pre>

    <script type="module" src="main.js"></script>
</body>
</html>

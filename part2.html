<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGPU Profiler - Part 2</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 16px; line-height: 1.5; }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; align-items: center; }
        button, select { padding: 8px 14px; font-size: 14px; cursor: pointer; border-radius: 6px; border: 1px solid #ccc; background: #fff; }
        button:hover { background: #f0f0f0; }
        pre { background: #1e1e1e; color: #d4d4d4; padding: 16px; border-radius: 8px; overflow-x: auto; height: 520px; font-size: 13px; }
    </style>
</head>
<body>
    <h2>Mobile WebGPU LLM Profiling: Part 2 (Custom GEMM)</h2>
    
    <div class="controls">
        <select id="sel-kernel">
            <option value="A">Kernel A (Naive WGSL)</option>
            <option value="B">Kernel B (Tiled 16x16 Shared Memory)</option>
            <option value="C">Kernel C (Vectorized vec4 Loads)</option>
            <option value="D">Kernel D (Fused Q4 Dequant + GEMM)</option>
        </select>
        <button id="btn-decode">Run Decode (M=1)</button>
        <button id="btn-prefill">Run Prefill (M=128)</button>
    </div>

    <h3>Benchmark Results</h3>
    <pre id="log">Awaiting execution...</pre>

    <script type="module" src="part2.js"></script>
</body>
</html>
